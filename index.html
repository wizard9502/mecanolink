<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <meta name="description" content="MecanoLink — pièces auto compatibles, SOS 24/7 et Mobile Money pour le Sénégal et l’Afrique de l’Ouest. Démo interactive.">
  <title>MecanoLink — Pièces auto & Sénégal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body>
  <a class="skip-link" href="#view">Aller au contenu</a>
  <div class="ambient" aria-hidden="true"><span></span><span></span></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M5 6h14l1.5 4.5a5 5 0 0 1-4.8 6.4H7.3a5 5 0 0 1-4.8-6.4L4 6h1Z"/><path d="M4 11h16M7 16v3M17 16v3"/><circle cx="12" cy="11" r="1"/></svg>
        </span>
        <span class="brand-text"><strong>Mecano<span>Link</span></strong><small>Sénégal &amp; Afrique de l’Ouest</small></span>
      </div>
      <div class="top-actions">
        <button class="icon-chip" id="cityBtn" data-action="open-city" type="button" title="Choisir ma ville" aria-label="Choisir ma ville">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="cityLabel">Dakar</span>
        </button>
        <button class="icon-chip mono" id="langBtn" data-action="lang" type="button" title="Changer de langue" aria-label="Changer de langue">FR</button>
        <button class="icon-chip sos" id="sosBtn" data-action="open-sos" type="button" title="SOS 24/7" aria-label="SOS 24/7"><span class="pulse-dot"></span>SOS</button>
        <button class="icon-chip" id="favBtn" data-action="open-favorites" type="button" title="Favoris" aria-label="Favoris">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          <b id="favCount" hidden>0</b>
        </button>
        <button class="icon-chip" id="cartBtn" data-action="open-cart" type="button" title="Panier" aria-label="Panier">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          <b id="cartCount" hidden>0</b>
        </button>
      </div>
    </header>

    <div id="vehicleBar" class="vehicle-bar"></div>

    <div class="search-row">
      <label class="search-box" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Rechercher une pièce, une réf OEM, une marque…" aria-label="Rechercher une pièce">
      </label>
      <button class="assistant-btn" id="assistantBtn" data-action="open-assistant" type="button" title="Assistant VIN / IA">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
        <span>VIN / IA</span>
      </button>
    </div>

    <main id="view" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation principale">
      <button type="button" data-view="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg><span>Accueil</span></button>
      <button type="button" data-view="catalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Catalogue</span></button>
      <button type="button" data-view="garage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13H3Z"/><path d="M7 21v-7h10v7M7 10h.01M17 10h.01"/></svg><span>Garage</span></button>
      <button type="button" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Commandes</span></button>
      <button type="button" data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profil</span></button>
    </nav>
  </div>

  <div id="installBanner" class="install-banner" hidden>
    <span>Installer MecanoLink sur votre téléphone ?</span>
    <button type="button" id="installBtn" data-action="install">Installer</button>
    <button type="button" id="installDismiss" data-action="install-dismiss" aria-label="Fermer">×</button>
  </div>

  <div id="sheetRoot" class="sheet-root" hidden></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="motion.js"></script>
</body>
</html>
